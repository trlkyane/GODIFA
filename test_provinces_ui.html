<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test GHN Provinces API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Test GHN Provinces API</h1>
    
    <button onclick="testAPI1()">Test API 1: /api/ghn/provinces.php</button>
    <button onclick="testAPI2()">Test API 2: Direct static</button>
    
    <div id="result"></div>
    
    <script>
        const resultDiv = document.getElementById('result');
        
        async function testAPI1() {
            resultDiv.innerHTML = '<p>⏳ Loading...</p>';
            try {
                const response = await fetch('/godifaproject.id.vn/api/ghn/provinces.php');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <h3 class="success">✅ Success!</h3>
                        <p><strong>Source:</strong> ${data.source || 'N/A'}</p>
                        <p><strong>Note:</strong> ${data.note || 'N/A'}</p>
                        <p><strong>Total provinces:</strong> ${data.data.length}</p>
                        <h4>First 5 provinces:</h4>
                        <pre>${JSON.stringify(data.data.slice(0, 5), null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3 class="error">❌ Failed</h3>
                        <p><strong>Error:</strong> ${data.error}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 class="error">❌ Network Error</h3>
                    <p>${error.message}</p>
                `;
            }
        }
        
        async function testAPI2() {
            resultDiv.innerHTML = '<p>⏳ Loading...</p>';
            try {
                const response = await fetch('/godifaproject.id.vn/api/ghn/provinces_static.php');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <h3 class="success">✅ Success!</h3>
                        <p><strong>Source:</strong> ${data.source || 'N/A'}</p>
                        <p><strong>Total provinces:</strong> ${data.data.length}</p>
                        <h4>First 5 provinces:</h4>
                        <pre>${JSON.stringify(data.data.slice(0, 5), null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3 class="error">❌ Failed</h3>
                        <p><strong>Error:</strong> ${data.error}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 class="error">❌ Network Error</h3>
                    <p>${error.message}</p>
                `;
            }
        }
        
        // Auto test on load
        window.onload = () => testAPI1();
    </script>
</body>
</html>
