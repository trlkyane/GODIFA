<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Yêu Cầu Hoàn Trả</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        textarea, select { width: 100%; padding: 8px; }
        button { background: #ff6600; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>🧪 Test Form: Yêu Cầu Hoàn Trả Đơn Hàng</h2>
    
    <form id="testReturnForm" enctype="multipart/form-data">
        <div class="form-group">
            <label>Chọn đơn hàng:</label>
            <select name="orderID" required>
                <option value="195">Đơn #195 - 44,900 đ</option>
                <option value="185">Đơn #185 - 40,500 đ</option>
                <option value="167">Đơn #167 - 13,900 đ</option>
                <option value="165">Đơn #165 - 60,900 đ</option>
                <option value="164">Đơn #164 - 40,500 đ</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Lý do hoàn trả:</label>
            <textarea name="reason" rows="4" required placeholder="Ví dụ: Sản phẩm bị lỗi, không hoạt động..."></textarea>
        </div>
        
        <div class="form-group">
            <label>Ảnh chứng minh (tùy chọn, tối đa 5 ảnh):</label>
            <input type="file" name="images[]" multiple accept="image/*">
        </div>
        
        <button type="submit">🚀 Gửi Yêu Cầu Hoàn Trả</button>
    </form>
    
    <div id="result"></div>
    
    <script>
    document.getElementById('testReturnForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const resultDiv = document.getElementById('result');
        const formData = new FormData(this);
        
        resultDiv.innerHTML = '<p>⏳ Đang gửi yêu cầu...</p>';
        
        fetch('api/create_return_request.php', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            console.log('Response status:', response.status);
            return response.json();
        })
        .then(data => {
            console.log('Response data:', data);
            
            if (data.success) {
                resultDiv.innerHTML = '<div class="result success">' +
                    '<strong>✅ Thành công!</strong><br>' +
                    data.message + '<br>' +
                    'Return ID: ' + data.returnID +
                    '</div>';
            } else {
                resultDiv.innerHTML = '<div class="result error">' +
                    '<strong>❌ Lỗi!</strong><br>' +
                    data.message +
                    '</div>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            resultDiv.innerHTML = '<div class="result error">' +
                '<strong>❌ Lỗi kết nối!</strong><br>' +
                error.message +
                '</div>';
        });
    });
    </script>
</body>
</html>
